upstream soundlog_app {
    server unix:/run/soundlog/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Media files served directly by Nginx
    location /media/ {
        alias /var/www/soundlog/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else proxied to Gunicorn (WhiteNoise handles /static/)
    location / {
        proxy_pass http://soundlog_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
